<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Bootstrap Jorge Garcia de la Cruz Diaz</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .cuadrado {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    
    <div class="container mt-5">
        <h1 class="text-center mb-4">Mi Proyecto Bootstrap</h1>
        
        
        <div class="row">
            <div class="col-md-4">
                <div class="cuadrado bg-primary">
                    Azul
                </div>
            </div>
            <div class="col-md-4">
                <div class="cuadrado bg-success">
                    Verde
                </div>
            </div>
            <div class="col-md-4">
                <div class="cuadrado bg-danger">
                    Rojo
                </div>
            </div>
        </div>
        
        
        <div class="row">
            <div class="col-md-6">
                <div class="cuadrado bg-warning text-dark">
                    Amarillo
                </div>
            </div>
            <div class="col-md-6">
                <div class="cuadrado bg-info text-dark">
                    Cyan
                </div>
            </div>
        </div>
        
        
        <div class="row">
            <div class="col-12">
                <div class="cuadrado bg-secondary">
                    Gris - Ancho completo
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
